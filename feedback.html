<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
</head>
<body>

    <h1>Форма обратной связи</h1>

    <p>Пожалуйста, заполните форму, чтобы оставить свои данные.</p>

    <form action="#" method="post">

        <h2>Личная информация</h2>

        <label for="name">Ваше имя:</label>

        <input type="text" id="name" name="name"
               placeholder="Введите ваше имя" required>
        

        <label for="email">Электронная почта:</label>

        <input type="email" id="email" name="email"
               placeholder="example@mail.ru" required>
        

        <h2>Пол</h2>

        <input type="radio" id="male" name="gender" value="Мужской" required>
        <label for="male">Мужской</label>
        

        <input type="radio" id="female" name="gender" value="Женский">
        <label for="female">Женский</label>
        

        <h2>Страна проживания</h2>

        <label for="country">Выберите страну:</label>

        <select id="country" name="country" required>
            <option value="">Выберите страну</option>
            <option value="Россия">Россия</option>
            <option value="Беларусь">Беларусь</option>
            <option value="Казахстан">Казахстан</option>
            <option value="Китай">Китай</option>
        </select>

        

        <input type="checkbox" id="agreement"
               name="agreement" required>
        <label for="agreement">
            Я согласен(на) с условиями обработки данных
        </label>

        

        <button type="submit">Отправить форму</button>

    </form>

</body>
</html>
